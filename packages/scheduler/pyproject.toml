[project]
name = "chengdu-edu-scheduler"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "chengdu-edu-core",
  "chengdu-edu-storage",
  "chengdu-edu-collectors",
  "chengdu-edu-parsers",
  "apscheduler>=3.10",
  "pyyaml>=6.0",
]

[tool.uv.sources]
chengdu-edu-core = { workspace = true }
chengdu-edu-storage = { workspace = true }
chengdu-edu-collectors = { workspace = true }
chengdu-edu-parsers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chengdu_edu_scheduler"]
