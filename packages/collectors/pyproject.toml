[project]
name = "chengdu-edu-collectors"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "chengdu-edu-core",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
]

[tool.uv.sources]
chengdu-edu-core = { workspace = true }

[dependency-groups]
dev = ["pytest-httpx>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chengdu_edu_collectors"]
