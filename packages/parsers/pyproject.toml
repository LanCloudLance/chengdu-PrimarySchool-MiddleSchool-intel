[project]
name = "chengdu-edu-parsers"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "chengdu-edu-core",
  "pyyaml>=6.0",
  "beautifulsoup4>=4.12",
]

[tool.uv.sources]
chengdu-edu-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chengdu_edu_parsers"]
