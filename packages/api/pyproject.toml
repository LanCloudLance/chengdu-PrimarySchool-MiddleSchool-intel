[project]
name = "chengdu-edu-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "jinja2>=3.1",
  "chengdu-edu-storage",
  "chengdu-edu-scheduler",
]

[tool.uv.sources]
chengdu-edu-storage = { workspace = true }
chengdu-edu-scheduler = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chengdu_edu_api"]
