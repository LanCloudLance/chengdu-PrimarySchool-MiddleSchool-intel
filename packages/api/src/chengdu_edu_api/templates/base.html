<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}成都教育情报{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <nav class="bg-white shadow-sm border-b border-gray-200">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center gap-6">
      <a href="/" class="text-lg font-semibold text-gray-900">成都教育情报</a>
      <a href="/" class="text-sm text-gray-600 hover:text-blue-600">学校搜索</a>
      <a href="/policies/government" class="text-sm text-gray-600 hover:text-blue-600">政府招生政策</a>
    </div>
  </nav>
  <main class="max-w-5xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>
  <footer class="border-t border-gray-200 bg-white mt-8">
    <div class="max-w-5xl mx-auto px-4 py-4 text-xs text-gray-500 leading-relaxed">
      {{ disclaimer | default("本站信息摘自公开转载及教育局公告整理，仅供参考，不作为入学依据。划片与对口以教育局当年公布文件及成都市义务教育招生入学服务平台（yjrx）为准。", true) }}
    </div>
  </footer>
</body>
</html>
