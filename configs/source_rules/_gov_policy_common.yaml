# 适用于本地宝等转载页面的通用规则（2026 成都各区细则常见表述）
fields:
  enrollment_scope:
    regex: '(?:公办小学入学对象|本区户籍适龄儿童|新区户籍适龄儿童|金牛区户籍适龄儿童)[：:，,\s]*([^\n。；;]{10,200})'
  registration_time:
    regex: '(5月6日10[：:]00[—\-~至]+12日17[：:]00|5月6日[—\-~至]+12日|5月6日[—\-~至]+\d{1,2}日|4月\d{1,2}日[—\-~至]+\d{1,2}日)'
  requirements:
    regex: '(双一致|两个.?一致|户籍|房产|居住证|100%产权)'
  contact:
    regex: '(?:咨询电话|入学咨询电话|教育咨询)[：:\s]*([0-9\-、，, ]{7,40})'
  notes:
    regex: '(成都市义务教育招生入学服务平台|四川天府新区招生入学管理平台)'
