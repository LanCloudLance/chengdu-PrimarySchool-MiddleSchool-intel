# 适用于本地宝等转载页面的通用规则（2025/2026 成都各区细则常见表述）
fields:
  enrollment_scope:
    regex: '(?:公办小学入学对象|入学对象)[：:\s]*([^\n。；;]{10,200})'
  registration_time:
    regex: '(5月\d{1,2}日[—\-~至]+\d{1,2}日|4月\d{1,2}日[—\-~至]+\d{1,2}日)'
  requirements:
    regex: '(双一致|户籍|房产|居住证)'
  contact:
    regex: '(?:咨询电话|入学咨询电话)[：:\s]*([0-9\-、，, ]+)'
  notes:
    regex: '(成都市义务教育招生入学服务平台)'
