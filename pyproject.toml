[project]
name = "chengdu-edu-intel"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = [
  "packages/core",
  "packages/storage",
  "packages/collectors",
  "packages/parsers",
  "packages/scheduler",
  "packages/api",
]

[tool.pytest.ini_options]
testpaths = ["packages"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-mock>=3.14",
  "httpx>=0.27",
  "ruff>=0.8",
  "aiosqlite",
]
ocr = [
  "rapidocr-onnxruntime>=1.3",
  "pillow>=10.0",
]
